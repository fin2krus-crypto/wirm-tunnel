plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.winrmvpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.winrmvpn"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation files('libs/mobile.aar')
}
