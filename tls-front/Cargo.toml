[package]
name = "winrm-tls-front"
version = "0.4.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
socket2 = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
