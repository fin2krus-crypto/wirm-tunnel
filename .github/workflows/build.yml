- name: Build Rustls TLS Front-End (Linux x86_64)
        working-directory: tls-front
        run: |
          cargo build --release
          cp target/release/winrm-tls-rustls ../dist/

      - name: Smoke-test WinRM Identify, NTLM & ChaCha20 Rejection (Rustls)
        run: |
          ./dist/winrm-vpn-server -plain -listen 127.0.0.1:15986 -psk "test-secret-key" &
          GO_PID=$!
          sleep 2
          ./dist/winrm-tls-rustls 0.0.0.0:5986 127.0.0.1:15986 winrm_cert.pem winrm_key.pem &
          RS_PID=$!
          sleep 2
          # 1. Проверяем WinRM Identify через rustls (AES-256-GCM)
          RESP=$(curl -sk --tls13-ciphers TLS_AES_256_GCM_SHA384 -X POST https://127.0.0.1:5986/wsman \
            -H "Content-Type: application/soap+xml;charset=UTF-8" \
            -d '<s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope" xmlns:wsmid="http://schemas.dmtf.org/wbem/wsman/identity/1/wsmanidentity.xsd"><s:Header/><s:Body><wsmid:Identify/></s:Body></s:Envelope>')
          echo "$RESP" | grep -q "Microsoft Corporation"
          # 2. Проверяем 401 Negotiate и заголовок Microsoft-HTTPAPI/2.0
          HDRS=$(curl -ski --tls13-ciphers TLS_AES_256_GCM_SHA384 -X POST https://127.0.0.1:5986/wsman -d '')
          echo "$HDRS" | grep -q "Microsoft-HTTPAPI/2.0"
          echo "$HDRS" | grep -q "WWW-Authenticate: Negotiate"
          # 3. Проверяем, что ChaCha20 ОТКЛОНЯЕТСЯ (как в Windows Server 2022/2025!)
          if curl -sk --tls13-ciphers TLS_CHACHA20_POLY1305_SHA256 https://127.0.0.1:5986/wsman >/dev/null 2>&1; then
            echo "FAIL: ChaCha20 was accepted!"
            kill $RS_PID $GO_PID
            exit 1
          fi
          echo "OK: ChaCha20 rejected as expected!"
          kill $RS_PID $GO_PID
