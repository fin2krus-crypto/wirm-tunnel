name: Build WinRM VPN (Server v0.3.0 + Android + macOS + Linux GUI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Build Static Rustls TLS Front-End (musl x86_64)
        working-directory: tls-front
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p ../cmd/server/embedded
          cp target/x86_64-unknown-linux-musl/release/winrm-tls-rustls ../cmd/server/embedded/winrm-tls-rustls

      - name: Tidy Go dependencies
        run: |
          go mod tidy

      - name: Build All-in-One Linux x86_64 Server Binary (v0.3.0)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/winrm-vpn-server ./cmd/server

      - name: Smoke-test Binary (WinRM, ChaCha20 Rejection & Web Panel :49777)
        run: |
          ./dist/winrm-vpn-server -listen 0.0.0.0:5986 -psk "test-secret-key" &
          SRV_PID=$!
          sleep 2
          RESP=$(curl -sk --tlsv1.3 --tls13-ciphers TLS_AES_256_GCM_SHA384 -X POST https://127.0.0.1:5986/wsman \
            -H "Content-Type: application/soap+xml;charset=UTF-8" \
            -d '<s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope" xmlns:wsmid="http://schemas.dmtf.org/wbem/wsman/identity/1/wsmanidentity.xsd"><s:Header/><s:Body><wsmid:Identify/></s:Body></s:Envelope>')
          echo "$RESP" | grep -q "Microsoft Corporation"
          HDRS=$(curl -ski --tlsv1.3 --tls13-ciphers TLS_AES_256_GCM_SHA384 -X POST https://127.0.0.1:5986/wsman -d '')
          echo "$HDRS" | grep -q "Microsoft-HTTPAPI/2.0"
          echo "$HDRS" | grep -q "WWW-Authenticate: NTLM"
          if curl -sk --tlsv1.3 --tls13-ciphers TLS_CHACHA20_POLY1305_SHA256 https://127.0.0.1:5986/wsman >/dev/null 2>&1; then
            echo "FAIL: ChaCha20 was accepted!"
            kill $SRV_PID
            exit 1
          fi
          curl -fsS http://127.0.0.1:49777/api/stats | grep -q '"version":"0.3.0"'
          echo "OK: Server v0.3.0 passed WinRM, ChaCha20 & Web Panel checks!"
          kill $SRV_PID

      - name: Build Android Native Core (.aar) via Gomobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -o android/app/libs/mobile.aar ./mobile

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/winrm-vpn-client.apk

      - name: Upload Linux & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-artifacts
          path: |
            dist/winrm-vpn-server
            dist/winrm-vpn-client.apk

  build-linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne X11/OpenGL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build Static Linux Helper & Embed into GUI Binary
        run: |
          go mod tidy
          mkdir -p linux-gui/embedded dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o linux-gui/embedded/winrm-vpn-linux-helper ./cmd/linux-helper

      - name: Build Linux x86_64 GUI Binary (Fyne)
        working-directory: linux-gui
        run: |
          go mod tidy
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/winrm-vpn-linux-gui .

      - name: Upload Linux GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-artifacts
          path: dist/winrm-vpn-linux-gui

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy Go dependencies
        run: |
          go mod tidy

      - name: Build Universal Go Helper (Apple Silicon arm64 + Intel amd64)
        run: |
          mkdir -p build_mac
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build_mac/helper-arm64 ./cmd/mac-helper
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build_mac/helper-amd64 ./cmd/mac-helper
          lipo -create -output build_mac/winrm-vpn-helper build_mac/helper-arm64 build_mac/helper-amd64

      - name: Build Universal SwiftUI Menu Bar App (arm64 + x86_64)
        run: |
          swiftc -O -target arm64-apple-macos12.0 -o build_mac/ui-arm64 macos/WinRMVPNApp.swift
          swiftc -O -target x86_64-apple-macos12.0 -o build_mac/ui-amd64 macos/WinRMVPNApp.swift
          lipo -create -output build_mac/WinRM-VPN build_mac/ui-arm64 build_mac/ui-amd64

      - name: Assemble Universal WinRM-VPN.app & Zip
        run: |
          mkdir -p "WinRM-VPN.app/Contents/MacOS" "WinRM-VPN.app/Contents/Resources" dist
          cp macos/Info.plist "WinRM-VPN.app/Contents/Info.plist"
          cp build_mac/WinRM-VPN "WinRM-VPN.app/Contents/MacOS/WinRM-VPN"
          cp build_mac/winrm-vpn-helper "WinRM-VPN.app/Contents/Resources/winrm-vpn-helper"
          chmod +x "WinRM-VPN.app/Contents/MacOS/WinRM-VPN" "WinRM-VPN.app/Contents/Resources/winrm-vpn-helper"
          ditto -c -k --sequesterRsrc --keepParent "WinRM-VPN.app" "dist/WinRM-VPN-macOS-Universal.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/WinRM-VPN-macOS-Universal.zip

  release:
    needs: [build-linux-android, build-linux-gui, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Publish all binaries to GitHub Release v0.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: WinRM-VPN v0.3.0 (Server v0.3.0 / Clients v0.1.1)
          files: |
            release_files/winrm-vpn-server
            release_files/winrm-vpn-client.apk
            release_files/winrm-vpn-linux-gui
            release_files/WinRM-VPN-macOS-Universal.zip
