name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запуск при пуше любого тега, начинающегося на v

permissions:
  contents: write # Обязательно для создания релиза и загрузки файлов

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Здесь ваш шаг сборки проекта (пример для архивации)
      - name: Build artifact
        run: |
          mkdir -p dist
          echo "Hello release" > dist/app.txt
          zip -r my-artifact.zip dist/

      # Создание релиза и загрузка артефакта
      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            my-artifact.zip
